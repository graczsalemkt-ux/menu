xml:Gracz Replace Landing:index.html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gracz Replace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* จัดการหน้าจอให้ฟิตพอดีกับมือถือทุกรุ่น ป้องกันการสกรอลล์หรือจอเบี้ยว */
        html, body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* รองรับ Dynamic Viewport ของ Safari/Chrome บนมือถือ */
            overflow: hidden;
            background-color: #0b0f12;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ภาพพื้นหลังหลัก */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.7)), 
                              url('https://lh3.googleusercontent.com/d/1nDVroDZW4Q3P3oKITNXbZ18PUQF-HeBX');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ตัวครอบเอฟเฟกต์ละอองดาว */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        /* กล่องข้อความแบบกระจกแก้ว (ปรับให้สมดุลและคมชัดยิ่งขึ้นบนมือถือ) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        0 0 15px 0 rgba(255, 255, 255, 0.05);
        }

        /* --- เอฟเฟกต์แสงสะท้อนวิ่งผ่านปุ่ม (Shimmer Sweep) --- */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }

        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-20deg);
            animation: shineSweep 3.5s infinite ease-in-out;
        }

        @keyframes shineSweep {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        /* ปุ่มหลักชิงโชค (สีขาวพรีเมียม + เงาเรืองแสงอ่อนๆ) */
        .btn-primary {
            background-color: white;
            color: #111827;
            box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.2), 
                        0 0 15px rgba(52, 211, 153, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-primary:active {
            transform: scale(0.97);
            background-color: #f3f4f6;
        }

        /* ปุ่มเล่นเกม (โปร่งแสงตัดขอบขาว) */
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            color: white;
            transition: all 0.25s ease;
        }

        .btn-secondary:active {
            background-color: rgba(255, 255, 255, 0.18);
            transform: scale(0.97);
        }

        /* อนิเมชั่นตอนหน้าเว็บโหลดเข้าครั้งแรก (สมูท นุ่มนวล) */
        @keyframes entrance {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-entrance {
            animation: entrance 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- ภาพพื้นหลังหลัก -->
    <div class="bg-container" id="bgImage"></div>

    <!-- Canvas สำหรับเอฟเฟกต์ละอองดาวสีเขียว-ทองลอยฟุ้งเบาๆ -->
    <canvas id="particleCanvas"></canvas>

    <!-- กล่องเนื้อหากระจกแก้ว จัดวางกลางหน้าจอพอดี ไม่ว่าจะจอไอโฟนหรือแอนดรอยด์รุ่นไหน -->
    <div class="glass-panel w-full max-w-[360px] xs:max-w-md p-8 text-center animate-entrance">
        
        <!-- ข้อความต้อนรับ -->
        <div class="mb-6">
            <h1 class="text-white text-2xl md:text-3xl font-bold mb-2.5 drop-shadow-md tracking-wide">สวัสดีครับ</h1>
            <h2 class="text-white text-lg md:text-xl font-bold mb-4 leading-snug drop-shadow-sm">
                สนุกกับเกมและกิจกรรมกับเพื่อน<br>พร้อมของรางวัลมากมาย
            </h2>
            
            <!-- เส้นคั่นกลางกล่องแก้ว -->
            <div class="h-[3px] w-12 bg-white/40 mx-auto rounded-full mb-5"></div>
            
            <!-- รายละเอียดกิจกรรม -->
            <div class="text-white text-[14px] md:text-[16px] font-medium leading-relaxed mb-4 space-y-1 inline-block text-left">
                <p class="drop-shadow-sm flex items-center gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    1. เล่นเกมเพื่อลุ้นของรางวัลอื่นๆ
                </p>
                <p class="drop-shadow-sm flex items-center gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    2. ลุ้นจักรยานยนต์ไฟฟ้า เพียงแนบสลิป
                </p>
            </div>
        </div>

        <!-- โซนปุ่มกด -->
        <div class="flex flex-col gap-4">
            
            <!-- ปุ่มที่ 1: ชิงโชคจักรยานยนต์ไฟฟ้า (มีเอฟเฟกต์แสงวิ่งผ่านและเงาเรืองแสง) -->
            <button onclick="handleButtonClick('luckyDraw')" 
                    class="btn-primary btn-shimmer w-full py-3.5 px-6 font-bold rounded-xl text-[16px] md:text-[18px]">
                ชิงโชคจักรยานยนต์ไฟฟ้า
            </button>

            <!-- ปุ่มที่ 2: เล่นเกมส์ -->
            <button onclick="handleButtonClick('game')" 
                    class="btn-secondary w-full py-3.5 px-6 font-semibold rounded-xl text-[16px] md:text-[18px] flex items-center justify-center gap-1.5">
                <span>เล่นเกมส์</span> 
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>

        <!-- Line ID ของแบรนด์ -->
        <p class="mt-8 text-white/60 text-xs tracking-widest font-semibold">Line ID : @gracz</p>
    </div>

    <script>
        // ฟังก์ชันจัดการคลิกปุ่มปลายทาง (ลิงก์เดิมที่ทำงานถูกต้องร้อยเปอร์เซ็นต์)
        function handleButtonClick(actionType) {
            if (actionType === 'game') {
                window.location.href = 'https://graczsalemkt-ux.github.io/graczreplace/'; 
            } else if (actionType === 'luckyDraw') {
                window.location.href = 'https://forms.gle/cmfbE5t7DLBFmQwXA'; 
            }
        }

        // จัดการตรวจสอบการโหลดภาพพื้นหลังหลัก
        const bg = document.getElementById('bgImage');
        const img = new Image();
        img.src = 'https://lh3.googleusercontent.com/d/1nDVroDZW4Q3P3oKITNXbZ18PUQF-HeBX';
        img.onerror = function() {
            // หากรูปหลักเกิดขัดข้อง จะแสดงพื้นหลังไล่สีโทนมืดแบบพรีเมียมแทน
            bg.style.backgroundImage = 'linear-gradient(135deg, #090d0f 0%, #151e22 100%)';
        };

        // --- 🧪 สร้างระบบเอฟเฟกต์ละอองดาวสีเขียว-ทองลอยเบาๆ (Canvas Sparkles) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.random() * 2 + 0.6; // เม็ดละอองขนาดเล็กละเอียด ไม่บดบังสายตา
                this.speedY = -(Math.random() * 0.7 + 0.2); // ลอยขึ้นช้าๆ อย่างนุ่มนวล
                this.speedX = (Math.random() - 0.5) * 0.25;
                // สลับสีเขียวใบไม้ และสีทองอบอุ่น เพื่อสื่อถึงแบรนด์ Gracz คอนเซปต์รักษ์โลกพรีเมียม
                const isGreen = Math.random() > 0.5;
                this.color = isGreen 
                    ? `rgba(52, 211, 153, ${Math.random() * 0.35 + 0.15})` // เขียวพาสเทล
                    : `rgba(253, 224, 71, ${Math.random() * 0.35 + 0.15})`; // เหลืองทองอ่อน
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < -10) { // เมื่อพ้นจอให้ไปเกิดใหม่ที่ด้านล่างขอบจอ
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // สร้างเอฟเฟกต์เรืองแสงแบบบางเบา
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // รีเซ็ตการเรืองแสงเพื่อประสิทธิภาพบนมือถือ
            }
        }

        // สร้างกลุ่มอนุภาคเริ่มต้น
        function initParticles() {
            particles = [];
            const particleCount = Math.min(45, Math.floor(window.innerWidth / 10)); // ปรับสัดส่วนตามขนาดหน้าจอมือถือ
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // ลูปแอนิเมชั่นวาดภาพ
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
