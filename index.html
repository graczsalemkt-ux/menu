<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracz Replace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; /* ปรับลดลงเพื่อให้แสง Gradient อยู่ด้านบนภาพ */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), 
                              url('https://lh3.googleusercontent.com/d/1nDVroDZW4Q3P3oKITNXbZ18PUQF-HeBX');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- เอฟเฟกต์แสงเคลื่อนไหวขยับได้ (Moving Gradient) --- */
        .gradient-ball-1, .gradient-ball-2 {
            position: absolute;
            width: 80vmax;
            height: 80vmax;
            border-radius: 50%;
            opacity: 0.18; /* ปรับความเข้มแสงให้สวยกำลังดี */
            filter: blur(100px);
            pointer-events: none;
            z-index: -1;
        }

        .gradient-ball-1 {
            background: radial-gradient(circle, rgba(52, 211, 153, 1) 0%, rgba(52, 211, 153, 0) 70%); /* โทนสีเขียวใบไม้สดชื่น */
            top: -20vmax;
            left: -20vmax;
            animation: move-1 35s linear infinite alternate;
        }

        .gradient-ball-2 {
            background: radial-gradient(circle, rgba(56, 189, 248, 1) 0%, rgba(56, 189, 248, 0) 70%); /* โทนสีฟ้าสะอาดตาสไตล์ Eco */
            bottom: -30vmax;
            right: -30vmax;
            animation: move-2 45s linear infinite alternate;
        }

        @keyframes move-1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30vmax, 15vmax) rotate(180deg); }
        }

        @keyframes move-2 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-25vmax, -40vmax); }
        }
        /* -------------------------------------------------- */

        .glass-panel {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                        0 0 20px 0 rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background-color: white;
            color: #111827;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(255,255,255,0.3);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: white;
            transform: scale(1.03);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-entry {
            animation: fadeInScale 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-end justify-center p-6 pb-14 md:pb-24">

    <div class="bg-container" id="bgImage"></div>

    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden;">
        <div class="gradient-ball-1"></div>
        <div class="gradient-ball-2"></div>
    </div>

    <div class="glass-panel w-full max-w-md p-10 md:p-12 text-center animate-entry">
        <div class="mb-8">
            <h1 class="text-white text-3xl md:text-4xl font-bold mb-3 drop-shadow-lg tracking-wide">สวัสดีครับ</h1>
            <h2 class="text-white text-xl md:text-2xl font-bold mb-5 leading-tight drop-shadow-md px-2">
                สนุกกับเกมและกิจกรรมกับเพื่อน<br>พร้อมของรางวัลมากมาย
            </h2>
            
            <div class="h-1.5 w-14 bg-white/50 mx-auto rounded-full mb-8"></div>
            
            <div class="text-white text-base md:text-lg font-medium leading-relaxed mb-6 space-y-1">
                <p class="drop-shadow-sm">1. เล่นเกมเพื่อลุ้นของรางวัลอื่นๆ</p>
                <p class="drop-shadow-sm">2. ลุ้นจักรยานยนต์ไฟฟ้า เพียงแนบสลิป</p>
            </div>
        </div>

        <div class="flex flex-col gap-5">
            <button onclick="handleButtonClick('luckyDraw')" 
                    class="btn-primary w-full py-5 px-8 font-bold rounded-2xl text-lg md:text-xl shadow-2xl transition-all">
                ชิงโชคจักรยานยนต์ไฟฟ้า
            </button>

            <button onclick="handleButtonClick('game')" 
                    class="btn-secondary w-full py-5 px-8 font-semibold rounded-2xl text-xl flex items-center justify-center gap-2 shadow-xl">
                <span>เล่นเกม</span> 
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>

        <p class="mt-12 text-white/70 text-sm tracking-wider font-semibold">Line ID : @gracz</p>
    </div>

    <script>
        function handleButtonClick(actionType) {
            if (actionType === 'game') {
                window.location.href = 'https://graczsalemkt-ux.github.io/graczreplace/'; 
            } else if (actionType === 'luckyDraw') {
                window.location.href = 'https://forms.gle/cmfbE5t7DLBFmQwXA'; 
            }
        }

        // จัดการ Error กรณีโหลดรูปภาพพื้นหลังหลักไม่สำเร็จ
        const bg = document.getElementById('bgImage');
        const img = new Image();
        img.src = 'https://lh3.googleusercontent.com/d/1nDVroDZW4Q3P3oKITNXbZ18PUQF-HeBX';
        img.onerror = function() {
            // หากรูปโหลดไม่ขึ้น จะรันสีพื้นหลังแบบเข้ม และคงเอฟเฟกต์แสงขยับไว้ให้ทำหน้าที่เดิมครับ
            bg.style.backgroundImage = 'linear-gradient(45deg, #000, #111)';
        };
    </script>
</body>
</html>
