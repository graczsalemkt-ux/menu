<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gracz Replace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3; /* ปรับระดับ z-index ให้อยู่ล่างสุดเพื่อรองรับเลเยอร์แสงเรืองแสง */
            /* เพิ่มความเข้มของ Overlay เพื่อให้กรอบเด่นขึ้น */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), 
                              url('https://lh3.googleusercontent.com/d/1nDVroDZW4Q3P3oKITNXbZ18PUQF-HeBX');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 🌟 เอฟเฟกต์แสงออร่าเรืองแสงตามนิ้วสัมผัสที่ซ่อนอยู่หลังแผงกระจกแก้ว (Interactive Radial Glow) */
        #interactive-glow {
            position: fixed;
            pointer-events: none;
            opacity: 0.35;
            filter: blur(100px);
            border-radius: 50%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.4) 0%, rgba(16, 185, 129, 0) 70%);
            z-index: -2;
            will-change: transform;
        }

        /* 🌟 Canvas แสดงระบบละอองหิ่งห้อยและประกายดาวแตกกระจายเมื่อกดสัมผัส */
        #sparkle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100; /* นำหน้าสุดเพื่อให้ประกายดาวระเบิดทับกล่องเนื้อหาอย่างสวยงาม */
        }

        .glass-panel {
            position: relative;
            z-index: 10;
            /* เพิ่มความทึบของสีขาวเป็น 0.18 และเพิ่ม Blur */
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            /* เพิ่มเส้นขอบให้ดูคมชัดขึ้น */
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            /* เพิ่มเงาและรัศมีเรืองแสง (Glow) */
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                        0 0 20px 0 rgba(255, 255, 255, 0.1);
        }

        /* ปุ่มหลักพร้อมลูกเล่น Shimmer แสงสะท้อนเรืองแสง */
        .btn-primary {
            background-color: white;
            color: #111827;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(255,255,255,0.3);
        }

        /* ลูกเล่นลำแสงสีขาวนวลวิ่งพาดปุ่มดึงดูดสายตา */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.5) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-20deg);
            animation: buttonShineSweep 4.0s infinite ease-in-out;
        }

        @keyframes buttonShineSweep {
            0% { left: -150%; }
            25% { left: 150%; }
            100% { left: 150%; }
        }

        /* เพิ่มเอฟเฟกต์ยุบตัวเมื่อสัมผัส (Haptic Feedback) บนมือถือ */
        .btn-primary:active, .btn-secondary:active {
            transform: scale(0.97) !important;
            transition: transform 0.1s ease;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: white;
            transform: scale(1.03);
        }

        /* ทางเข้าหลัก: มีเอนทรานซ์เข้ามาก่อน จากนั้นเริ่มลูปกระพริบกรอบเรืองแสงสีเขียวแบรนด์รักษ์โลก */
        .animate-entry {
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       borderPulse 3.5s infinite ease-in-out 0.8s;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 🌟 เอฟเฟกต์กระพริบหายใจเรืองแสงรอบนอกกล่องกระจก (Breathing Glow) 🌟 */
        @keyframes borderPulse {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.3);
                box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                            0 0 20px 0 rgba(255, 255, 255, 0.1);
            }
            50% {
                border-color: rgba(52, 211, 153, 0.8); /* สีเขียวแบรนด์ Gracz */
                box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                            0 0 35px 6px rgba(52, 211, 153, 0.45); /* ออร่าเรืองแสงสีเขียวหนานุ่มสวยงาม */
            }
        }

        /* --- 🛵 เอฟเฟกต์มอเตอร์ไซค์สกูตเตอร์วิ่งผ่านแบบวนลูปต่อเนื่อง --- */
        .scooter-container {
            position: fixed;
            bottom: 15%; /* ปรับตำแหน่งความสูงให้สัมพันธ์กับหน้าจอมือถือ */
            left: -190px; /* เริ่มต้นนอกจอฝั่งซ้าย */
            width: 170px; /* ขยายขนาดมอเตอร์ไซค์ให้พรีเมียมสมเป็นรางวัลใหญ่ */
            height: auto;
            z-index: 50; /* วิ่งผ่านข้างหน้ากล่องเพื่อความตื่นเต้น */
            pointer-events: none; /* เพื่อไม่ให้ขัดขวางการกดปุ่มบนหน้าจอ */
            will-change: left; /* ช่วยจัดการประมวลผลบน GPU ลดการหน่วงบนมือถือ */
            /* เร่งความเร็วรวมของลูปขึ้นเป็น 12 วินาที */
            animation: driveAcrossLoop 12.0s linear infinite;
        }

        /* กลับด้านรูปภาพให้ตัวรถหันหน้าไปทางขวา (วิ่งเดินหน้าตามการเคลื่อนที่) */
        .scooter-container img {
            transform: scaleX(-1);
        }

        /* เอฟเฟกต์เด้งขึ้นลงเบาๆ ของตัวรถขณะขับขี่ให้ดูสมจริง */
        .scooter-bounce {
            animation: scooterRideBounce 0.12s infinite alternate ease-in-out;
        }

        /* 🌟 มอเตอร์ไซค์พิเศษสำหรับการกดปุ่มชิงโชค (Turbo Boost Mode) 🌟 */
        .scooter-turbo-container {
            position: fixed;
            bottom: 15%;
            left: -260px;
            width: 195px; /* ขนาดใหญ่ขึ้นเล็กน้อยเพื่อเพิ่มพลังความยิ่งใหญ่ */
            height: auto;
            z-index: 110; /* ทับทุกเลเยอร์ */
            pointer-events: none;
            will-change: left;
            display: none; /* ซ่อนไว้ก่อนกดปุ่ม */
        }

        .scooter-turbo-container.active {
            display: block;
            animation: turboDriveAcross 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .scooter-turbo-container img {
            transform: scaleX(-1);
            /* เพิ่ม Motion Blur และ เงาสีเขียวเรืองแสงตอนรถเร่งเทอร์โบ */
            filter: blur(1.5px) drop-shadow(0 0 20px rgba(52, 211, 153, 0.8));
        }

        @keyframes turboDriveAcross {
            0% { left: -260px; }
            100% { left: calc(100vw + 260px); }
        }

        /* --- 👜 เอฟเฟกต์กระเป๋าผ้าลอยพลิ้วผ่านแบบวนลูปต่อเนื่อง --- */
        .bag-container {
            position: fixed;
            bottom: 42%; /* ลอยอยู่ช่วงกลางค่อนไปทางล่าง */
            left: -140px; /* เริ่มนอกจอ */
            width: 110px; /* ขยายขนาดกระเป๋าให้เห็นภาพชัดเจนสวยงาม */
            height: auto;
            z-index: 50;
            pointer-events: none;
            will-change: left;
            /* เร่งความเร็วรวมของลูปขึ้นเป็น 12 วินาที */
            animation: bagAcrossLoop 12.0s linear infinite;
        }

        .bag-float {
            animation: itemFloatSway 3.5s infinite alternate ease-in-out;
        }

        /* --- 🥛 เอฟเฟกต์แก้วน้ำลอยผ่านแบบวนลูปต่อเนื่อง --- */
        .glass-item-container {
            position: fixed;
            bottom: 68%; /* ลอยอยู่ช่วงบนเหนือระดับสายตา */
            left: -120px;
            width: 90px; /* ขยายขนาดแก้วน้ำให้เห็นโลโก้และดีเทลเด่นชัด */
            height: auto;
            z-index: 50;
            pointer-events: none;
            will-change: left;
            /* เร่งความเร็วรวมของลูปขึ้นเป็น 12 วินาที */
            animation: glassAcrossLoop 12.0s linear infinite;
        }

        .glass-item-float {
            animation: itemFloatSway 4.5s infinite alternate-reverse ease-in-out;
        }

        /* 🔄 คีย์เฟรมระบบจัดการจังหวะวนลูปและคุมความเร็วใหม่ทั้งหมด (Sync Cycle: 12.0s) 
           ปรับปรุงให้เคลื่อนไหวรวดเร็ว ต่อเนื่อง ไร้รอยต่อ
        */
        @keyframes driveAcrossLoop {
            0% { left: -190px; }
            33.3% { left: calc(100vw + 190px); } /* วิ่งกวาดผ่านหน้าจออย่างรวดเร็วใน 4 วินาที (33.3% ของ 12s) */
            100% { left: calc(100vw + 190px); } /* พักรอนอกจอจนจบรอบลูป */
        }

        @keyframes bagAcrossLoop {
            0% { left: -140px; }
            25% { left: -140px; } /* หน่วงเวลาเริ่มวิ่งไว้ 3 วินาที (25% ของ 12s) เพื่อปล่อยช่วงห่างงามๆ */
            66.7% { left: calc(100vw + 140px); } /* ปลิวลมละลิ่วผ่านอย่างว่องไวใน 5 วินาที (ถึงวินาทีที่ 8) */
            100% { left: calc(100vw + 140px); } /* พักรอนอกจอจนจบรอบลูป */
        }

        @keyframes glassAcrossLoop {
            0% { left: -120px; }
            50% { left: -120px; } /* หน่วงเวลาเริ่มวิ่งไว้ 6 วินาที (50% ของ 12s) */
            91.7% { left: calc(100vw + 120px); } /* ลอยหมุนผ่านไปอย่างกระฉับกระเฉงใน 5 วินาที (ถึงวินาทีที่ 11) */
            100% { left: calc(100vw + 120px); } /* พักรอนอกจอจนจบรอบลูป */
        }

        @keyframes scooterRideBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        /* คีย์เฟรมลอยละลิ่วส่ายเอียงเบาๆ ของกระเป๋าและแก้วน้ำช่วยสร้างมิติ */
        @keyframes itemFloatSway {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(10deg); }
            100% { transform: translateY(6px) rotate(-8deg); }
        }
        /* ------------------------------------------------------------------ */
    </style>
</head>
<!-- ปรับ body เป็น flex items-center และความสูง min-h-[100dvh] ป้องกันอาการขอบล่างโดนตัดบนสมาร์ทโฟน -->
<body class="min-h-[100dvh] flex items-center justify-center p-4 xs:p-6">

    <div class="bg-container" id="bgImage"></div>

    <!-- 🌟 เลเยอร์เรืองแสงขยับตามนิ้วสัมผัสที่ซ่อนอยู่เบื้องหลังกล่องแก้ว -->
    <div id="interactive-glow"></div>

    <!-- 🌟 Canvas แสดงละอองดาวแวดล้อมและประกายดาวแตกเมื่อกดสัมผัส -->
    <canvas id="sparkle-canvas"></canvas>

    <!-- 🛵 ตัวมอเตอร์ไซค์สกูตเตอร์ไฟฟ้าวิ่งผ่านหน้าจอตอนโหลดเว็บ (และสุ่มวนลูป) -->
    <div class="scooter-container">
        <div class="scooter-bounce">
            <img src="https://lh3.googleusercontent.com/d/1E2FAfdb8Arvyd3aUgZfCMBpuqj01kaBa" class="w-full h-auto" alt="Motorcycle">
        </div>
    </div>

    <!-- 🌟 🛵 มอเตอร์ไซค์เวอร์ชันเร่งความเร็วเทอร์โบพร้อมเสียงประกายไฟพ่นท่อเมื่อกดชิงโชค 🌟 -->
    <div class="scooter-turbo-container" id="turbo-scooter">
        <div class="scooter-bounce">
            <img src="https://lh3.googleusercontent.com/d/1E2FAfdb8Arvyd3aUgZfCMBpuqj01kaBa" class="w-full h-auto" alt="Turbo Motorcycle">
        </div>
    </div>

    <!-- 👜 กระเป๋าผ้ารักษ์โลก Gracz ลอยพลิ้วผ่านหน้าจอ (และสุ่มวนลูป) -->
    <div class="bag-container">
        <div class="bag-float">
            <img src="https://lh3.googleusercontent.com/d/1B4AM7snH34zx3khfoItKImH7pVdC4-n0" class="w-full h-auto" alt="Eco Bag">
        </div>
    </div>

    <!-- 🥛 แก้วน้ำ Gracz ลอยส่ายเบาๆ ผ่านหน้าจอ (และสุ่มวนลูป) -->
    <div class="glass-item-container">
        <div class="glass-item-float">
            <img src="https://lh3.googleusercontent.com/d/1ay6NAilTSS-Q9e-b59YJbffdJM40nv3-" class="w-full h-auto" alt="Eco Cup">
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลักที่ปรับให้เด่นขึ้น และใช้ padding ยืดหยุ่นเพื่อกันส่วนล่างตกหน้าจอ -->
    <div class="glass-panel w-full max-w-md p-6 xs:p-8 sm:p-10 md:p-12 text-center animate-entry my-auto">
        <div class="mb-5 sm:mb-8">
            <h1 class="text-white text-2xl sm:text-3xl md:text-4xl font-bold mb-2 sm:mb-3 drop-shadow-lg tracking-wide">สวัสดีครับ</h1>
            <h2 class="text-white text-lg sm:text-xl md:text-2xl font-bold mb-4 sm:mb-5 leading-tight drop-shadow-md px-2">
                สนุกกับเกมและกิจกรรมกับเพื่อน<br>พร้อมของรางวัลมากมาย
            </h2>
            
            <div class="h-1.5 w-14 bg-white/50 mx-auto rounded-full mb-5 sm:mb-6"></div>
            
            <!-- 🌟 แถบรายละเอียดกิจกรรมรูปแบบการ์ดพรีเมียมฟิตหน้าจอมือถือ 🌟 -->
            <div class="space-y-2.5 sm:space-y-3.5 mb-5 sm:mb-7 max-w-sm mx-auto">
                
                <!-- การ์ดรายละเอียดที่ 1: เล่นเกมเพื่อลุ้นของรางวัลอื่นๆ -->
                <div class="flex items-center gap-3 sm:gap-3.5 bg-white/5 border border-white/10 rounded-2xl p-2.5 sm:p-3.5 text-left transition-all duration-300 hover:bg-white/10">
                    <div class="flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-emerald-500/20 to-emerald-400/5 flex items-center justify-center border border-emerald-500/20 text-emerald-400 text-lg sm:text-xl shadow-inner">
                        🎮
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-semibold text-xs sm:text-sm md:text-base leading-snug drop-shadow-sm">1. เล่นเกมเพื่อลุ้นของรางวัลอื่นๆ</p>
                        <p class="text-white/60 text-[11px] sm:text-xs mt-0.5 font-light">ร่วมสนุกสะสมแต้มและลุ้นรับไอเทมมากมาย</p>
                    </div>
                </div>

                <!-- การ์ดรายละเอียดที่ 2: ลุ้นจักรยานยนต์ไฟฟ้า เพียงแนบสลิป -->
                <div class="flex items-center gap-3 sm:gap-3.5 bg-white/5 border border-white/10 rounded-2xl p-2.5 sm:p-3.5 text-left transition-all duration-300 hover:bg-white/10">
                    <div class="flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-cyan-400/5 flex items-center justify-center border border-cyan-500/20 text-cyan-400 text-lg sm:text-xl shadow-inner">
                        🛵
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-semibold text-xs sm:text-sm md:text-base leading-snug drop-shadow-sm">2. ลุ้นจักรยานยนต์ไฟฟ้า เพียงแนบสลิป</p>
                        <p class="text-white/60 text-[11px] sm:text-xs mt-0.5 font-light">ชิงรางวัลใหญ่สกูตเตอร์ไฟฟ้าแห่งอนาคต</p>
                    </div>
                </div>

            </div>
            <!-- --------------------------------------------------------------- -->
        </div>

        <div class="flex flex-col gap-3.5 sm:gap-5">
            <!-- ปุ่มที่ 1: ชิงโชคจักรยานยนต์ไฟฟ้า -->
            <button onclick="handleButtonClick('button2')" 
                    class="btn-primary w-full py-4 sm:py-5 px-6 sm:px-8 font-bold rounded-2xl text-base sm:text-lg md:text-xl shadow-2xl transition-all">
                ชิงโชคจักรยานยนต์ไฟฟ้า
            </button>

            <!-- ปุ่มที่ 2: เล่นเกมส์ -->
            <button onclick="handleButtonClick('button1')" 
                    class="btn-secondary w-full py-4 sm:py-5 px-6 sm:px-8 font-semibold rounded-2xl text-base sm:text-lg md:text-xl flex items-center justify-center gap-2 shadow-xl">
                <span>เล่นเกมส์</span> 
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>

        <!-- ข้อความ Line ID : @gracz รักษาระยะห่างที่สวยงามและไม่ล้นจอ -->
        <p class="mt-6 sm:mt-8 md:mt-12 text-white/70 text-xs sm:text-sm tracking-wider font-semibold">Line ID : @gracz</p>
    </div>

    <script>
        function handleButtonClick(type) {
            if (type === 'button1') {
                window.location.href = 'https://graczsalemkt-ux.github.io/graczreplace/'; 
            } else if (type === 'button2') {
                // 🌟 ทริกเกอร์ระบบมอเตอร์ไซค์เทอร์โบและพ่นประกายไฟเมื่อกดปุ่มชิงโชค 🌟
                const turboScooter = document.getElementById('turbo-scooter');
                turboScooter.classList.add('active');

                // บันทึกเวลาเริ่มและคำนวณตำแหน่งพ่นไฟท่อไอเสียแบบเรียลไทม์
                const start = Date.now();
                const duration = 1200; // เวลาการวิ่งของรถเทอร์โบ (ตรงกับ CSS Animation: 1.2s)

                function spawnTurboSparks() {
                    const elapsed = Date.now() - start;
                    const progress = elapsed / duration;

                    if (progress < 1) {
                        // คำนวณหาตำแหน่ง X และ Y ของรถชั่วขณะที่กำลังวิ่งผ่าน
                        const startX = -260;
                        const endX = window.innerWidth + 260;
                        const currentX = startX + (endX - startX) * progress;
                        
                        // ระดับความสูงของตัวรถ (bottom: 15% เทียบจากด้านล่างของหน้าจอ)
                        const currentY = window.innerHeight * 0.85;

                        // พ่นกลุ่มละอองไฟประกายระยิบระยับหนาแน่น ยิงออกข้างหลังท่อไอเสียรถ
                        for (let i = 0; i < 10; i++) {
                            const p = new Particle(currentX, currentY, false);
                            p.vx = -Math.random() * 8 - 4; // พ่นไปด้านหลังอย่างรวดเร็ว
                            p.vy = (Math.random() - 0.5) * 6; // ทิศทางการกระจายบน-ล่าง
                            p.size = Math.random() * 4 + 1.5; // ขนาดประกายดาวเม็ดใหญ่ขึ้น
                            particles.push(p);
                        }
                        requestAnimationFrame(spawnTurboSparks);
                    }
                }

                // เริ่มต้นพ่นประกายไฟท่อไอเสียทันที
                spawnTurboSparks();

                // หน่วงเวลาการเปลี่ยนหน้าเว็บไป 1.3 วินาที เพื่อให้ผู้ใช้สัมผัสความตื่นเต้นอย่างเต็มตา
                setTimeout(() => {
                    window.location.href = 'https://forms.gle/cmfbE5t7DLBFmQwXA'; 
                }, 1300);
            }
        }

        const bg = document.getElementById('bgImage');
        const img = new Image();
        img.src = 'https://lh3.googleusercontent.com/d/1nDVroDZW4Q3P3oKITNXbZ18PUQF-HeBX';
        img.onerror = function() {
            bg.style.backgroundImage = 'linear-gradient(45deg, #000, #222)';
        };

        // =========================================================================
        // 🧪 โค้ดระบบเอฟเฟกต์ตอบสนองอัจฉริยะ (Ambient & Touch Interactive Sparks)
        // =========================================================================
        
        // 1. จัดการเลเยอร์แสงเรืองแสงขยับตามนิ้วสัมผัส (Interactive Glow Tracking)
        const glowEl = document.getElementById('interactive-glow');
        let glowX = window.innerWidth / 2;
        let glowY = window.innerHeight / 2;
        let targetGlowX = window.innerWidth / 2;
        let targetGlowY = window.innerHeight / 2;

        function updateGlowPosition(clientX, clientY) {
            targetGlowX = clientX;
            targetGlowY = clientY;
        }

        window.addEventListener('pointermove', (e) => {
            updateGlowPosition(e.clientX, e.clientY);
        });

        window.addEventListener('pointerdown', (e) => {
            updateGlowPosition(e.clientX, e.clientY);
            // สั่งให้ดาวระเบิดกระจายจากจุดกด
            createSparkleBurst(e.clientX, e.clientY);
        });

        // 2. จัดการแคนวาสละอองดาว (Sparkle & Ambient Particle System)
        const canvas = document.getElementById('sparkle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // โครงสร้างวัตถุละอองดาวเดี่ยว
        class Particle {
            constructor(x, y, isAmbient = false) {
                this.x = x;
                this.y = y;
                this.isAmbient = isAmbient;

                if (isAmbient) {
                    // ละอองหิ่งห้อยลอยเบาๆ เป็นพื้นหลัง
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = -Math.random() * 0.5 - 0.2;
                    this.size = Math.random() * 1.8 + 0.6;
                    this.alpha = 0;
                    this.targetAlpha = Math.random() * 0.4 + 0.1;
                    this.fadeSpeed = 0.008;
                    // เลือกสีเขียวหรือสีทองเพื่อให้เข้ากับแบรนด์ Gracz
                    this.color = Math.random() > 0.5 ? '52, 211, 153' : '253, 224, 71';
                } else {
                    // ประกายดาวที่แตกตัวจากการสัมผัส (Touch Burst)
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4.5 + 1.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 3 + 1;
                    this.alpha = 1.0;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.gravity = 0.06; // มีแรงดึงดูดช่วยดึงละอองดาวร่วงหล่นลงมาให้ดูเป็นธรรมชาติ
                    this.color = Math.random() > 0.6 ? '52, 211, 153' : (Math.random() > 0.5 ? '253, 224, 71' : '255, 255, 255');
                }
            }

            update() {
                if (this.isAmbient) {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.alpha < this.targetAlpha) {
                        this.alpha += this.fadeSpeed;
                    }
                    // หากลอยพ้นขอบบนให้ไปเริ่มต้นใหม่ข้างล่าง
                    if (this.y < -10) {
                        this.y = canvas.height + 10;
                        this.x = Math.random() * canvas.width;
                        this.alpha = 0;
                    }
                } else {
                    this.x += this.vx;
                    this.vy += this.gravity;
                    this.y += this.vy;
                    this.alpha -= this.decay;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.shadowBlur = this.isAmbient ? 8 : 12;
                ctx.shadowColor = `rgba(${this.color}, 1)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // เริ่มต้นสร้างละอองหิ่งห้อยลอยเบาๆ ประดับพื้นหลัง
        function initAmbientParticles() {
            const ambientCount = Math.min(35, Math.floor(window.innerWidth / 12));
            for (let i = 0; i < ambientCount; i++) {
                particles.push(new Particle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    true
                ));
            }
        }

        // ฟังก์ชันสร้างกลุ่มดาวกระจายเมื่อเกิดสัมผัส
        function createSparkleBurst(x, y) {
            const burstCount = 14;
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(x, y, false));
            }
        }

        // แอนิเมชันลูปรันการเคลื่อนไหว (High Performance Render Loop)
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // คำนวณเคลื่อนที่แสงเรืองแสงตามนิ้วอย่างราบรื่น (Lerp Physics)
            glowX += (targetGlowX - glowX) * 0.08;
            glowY += (targetGlowY - glowY) * 0.08;
            glowEl.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

            // จัดการวาดและอัปเดตละอองทุกชิ้น
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                // ลบประกายดาวที่จางหายหมดออกเพื่อไม่ให้เปลืองแรม
                if (!p.isAmbient && p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(drawFrame);
        }

        initAmbientParticles();
        drawFrame();
    </script>
</body>
</html>
